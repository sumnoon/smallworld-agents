name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  browser-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check browser JavaScript
        run: |
          node --check client/app.js
          node --check client/renderer.js
          node --check client/tools.js
          node --check tools/render-roadmap.mjs
          node --check asset-preview.js
          node --check tools/video/render_intro.mjs
      - name: Verify generated asset metadata
        run: |
          node tools/inspect-assets.mjs
          git diff --exit-code -- assets/manifest.json assets/manifest.js
